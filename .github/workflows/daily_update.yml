name: Daily landslide risk update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the model
        run: python model.py

      - name: Commit updated results
        run: |
          git config user.name "landslide-ews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.json data/rainfall_sample_30day.csv
          git commit -m "Daily update: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
